name: Refresh UT dining menus

on:
  schedule:
    - cron: '17 9 * * *'    # daily, ~3:17 AM Central (4:17 during daylight time), before the 5:23 AM copy into the app
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-menu
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape FoodPro
        run: node scripts/scrape.mjs docs/menu.json

      - name: Commit if the menu changed
        run: |
          if git diff --quiet -- docs/menu.json && git ls-files --error-unmatch docs/menu.json >/dev/null 2>&1; then
            echo "Menu unchanged."
            exit 0
          fi
          git config user.name  "menu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/menu.json
          git commit -m "Menu refresh $(date -u +%Y-%m-%d)"
          git push
