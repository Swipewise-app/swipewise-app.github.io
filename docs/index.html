<title>Swipewise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: phone-first single column. Sticky header with day strip + hall tabs; meal "tickets" stacked below. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E8ECE6; --ink:#16201A; --muted:#5B6A60; --line:#D5DCD3;
  --accent:#1E7552; --accent-ink:#FFFFFF; --accent-soft:#DCEFE4;
  --treat:#B8661A; --treat-soft:#FBEBD8;
  --p:#2F5FD0; --c:#B07A12; --f:#B5446E;
  --display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#161E19; --sunk:#1D2721; --ink:#E6EEE8; --muted:#97A79C; --line:#2A362F;
  --accent:#4CC08A; --accent-ink:#06130C; --accent-soft:#183326;
  --treat:#F0AE5A; --treat-soft:#33240F;
  --p:#86A6FF; --c:#E2B74F; --f:#F08DB3; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161E19; --sunk:#1D2721; --ink:#E6EEE8; --muted:#97A79C; --line:#2A362F;
  --accent:#4CC08A; --accent-ink:#06130C; --accent-soft:#183326;
  --treat:#F0AE5A; --treat-soft:#33240F;
  --p:#86A6FF; --c:#E2B74F; --f:#F08DB3; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-stretch:80%;font-weight:850;font-size:26px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.fresh{font-size:12px;color:var(--muted);text-align:right}
.days{display:flex;gap:6px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 10px;min-width:54px;text-align:center;font:inherit;cursor:pointer;position:relative}
.day b{display:block;font-family:var(--display);font-stretch:85%;font-size:18px;line-height:1.1}
.day small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] small{color:inherit;opacity:.75}
.day .wx{display:block;font-style:normal;font-size:10.5px;line-height:1.2;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.day .wx .hi{color:var(--ink);font-weight:700}
.day[aria-pressed="true"] .wx,.day[aria-pressed="true"] .wx .hi{color:inherit}
.day .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--treat)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:12px;margin-top:8px}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:13px;padding:8px 2px;white-space:nowrap;border-radius:9px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hours{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-block:16px 4px}
.hours .h{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:17px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.treat{background:var(--treat-soft);color:var(--treat)}
details.week{font-size:13px;color:var(--muted)}
details.week summary{cursor:pointer}
.weektbl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin-top:6px;font-variant-numeric:tabular-nums}
.weektbl .on{color:var(--ink);font-weight:700}
.meals{display:grid;gap:14px;margin-top:14px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.meal.is-treat{border-color:var(--treat)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 8px}
.mhead h2{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:20px;margin:0}
.mhead .tgt{font-size:12px;color:var(--muted)}
.why{padding:0 14px 8px;font-size:14px;color:var(--muted)}
.meal.is-treat .why{color:var(--treat)}
ul.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;border-top:1px solid var(--line)}
.item .nm{font-weight:700;min-width:0}
.item .qty{color:var(--accent);font-weight:700}
.item .meta{font-size:12px;color:var(--muted);grid-column:1}
.item .kc{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
.nope{grid-column:2;justify-self:end;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:9}
.item .mac{grid-column:2;font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.role{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-right:6px;color:var(--muted)}
.role.protein{color:var(--p)} .role.treat,.role.dessert{color:var(--treat)}
.mp{color:var(--p)} .mc{color:var(--c)} .mf{color:var(--f)}
.total{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 14px;background:var(--sunk)}
.total .big{font-family:var(--display);font-stretch:85%;font-weight:850;font-size:22px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);display:flex;overflow:hidden}
.bar span{display:block;height:100%}
.total .mac{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px 12px}
.mfoot small{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.empty{padding:14px;color:var(--muted);font-size:14px}
.daysum{margin-top:16px;padding:14px;border-radius:var(--r);background:var(--ink);color:var(--bg)}
.daysum h3{margin:0 0 4px;font-family:var(--display);font-stretch:85%;font-size:15px;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.daysum .row{display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums}
.daysum .row b{font-family:var(--display);font-stretch:85%;font-size:22px}
.daysum p{margin:8px 0 0;font-size:13px;opacity:.85}
.tip{margin-top:14px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 var(--r) var(--r) 0;font-size:14px}
.tip b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:2px}
.plan h2{font-family:var(--display);font-stretch:85%;font-weight:850;font-size:22px;margin:22px 0 6px}
.plan p,.plan li{max-width:62ch}
.plan ul{padding-left:20px;margin:6px 0}
.plan li{margin-block:4px}
.rules{display:grid;gap:10px;margin-top:10px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.rule h3{margin:0 0 2px;font-size:15px}
.rule p{margin:0;color:var(--muted);font-size:14px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center;font-size:12px}
.wk div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 2px}
.wk .t{border-color:var(--treat);background:var(--treat-soft);color:var(--treat);font-weight:700}
.stale{margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--treat-soft);color:var(--treat);font-size:14px;font-weight:700}
.tl{display:grid;gap:10px;margin-top:14px}
.cls{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:baseline;padding:6px 2px;font-size:14px}
.cls .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.cls b{font-family:var(--display);font-stretch:85%;font-size:16px}
.cls .rm{color:var(--muted)}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slot.is-treat{border-color:var(--treat)}
.slot .sh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px 4px}
.slot .sh h2{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:19px;margin:0}
.slot .win{padding:0 14px 8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.best{padding:10px 14px;border-top:1px solid var(--line)}
.best .pl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.best .pl b{font-size:16px}
.walk{font-size:12px;color:var(--muted);margin-top:2px}
.pick{margin-top:6px;font-size:14px}
.est{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.pill.dd{background:var(--sunk);color:var(--ink)}
.pill.mp{background:var(--accent-soft);color:var(--accent)}
.pill.fav{background:var(--ink);color:var(--bg)}
.mini{list-style:none;margin:6px 0 0;padding:0;font-size:14px}
.mini li{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.mini li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.alts{padding:8px 14px 12px;border-top:1px dashed var(--line);font-size:13px}
.alts h3{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.alts li{margin:4px 0}
.alts ul{margin:0;padding-left:18px}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;font-size:13px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.slot.now{border:2px solid var(--accent)}
.eyebrow{display:flex;justify-content:space-between;gap:8px;padding:10px 14px 0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--accent)}
.eyebrow span:last-child{color:var(--muted);letter-spacing:.04em}
.picks{margin-top:12px;background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:12px 14px;display:grid;gap:12px}
.pk-head h2{font-family:var(--display);font-stretch:85%;font-weight:850;font-size:21px;margin:0}
.pk-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.pk-meal{display:grid;gap:6px}
.pk-label{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.pk-label b{color:var(--ink);font-size:14px}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pk-opt{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;border-radius:12px;padding:10px 12px;cursor:pointer;min-width:0}
.pk-opt.on{border:2px solid var(--accent);background:var(--accent-soft)}
.pk-name{font-weight:700;font-size:15px;line-height:1.25}
.pk-with{font-size:13px;color:var(--ink);opacity:.85;line-height:1.3}
.pk-where,.pk-sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pk-opt.on .pk-sub{color:var(--accent);font-weight:700}
.pk-auto{justify-self:start;font-size:12px}
.pk-sum{list-style:none;margin:0;padding:0;font-size:14px;display:grid;gap:4px}
.pk-sum span{color:var(--muted)}
.budget{margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--sunk);font-size:14px}
.budget b{font-family:var(--display);font-stretch:85%}
.note{font-size:12px;color:var(--muted);margin-top:22px;line-height:1.5}
.sel{user-select:all;font-weight:700;color:var(--ink)}
.menulink{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border:2px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:var(--r);font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-align:left}
.menulink small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.menulink .arr{color:var(--accent);font-size:20px}
.back{margin-top:14px}
.mtitle{font-family:var(--display);font-stretch:85%;font-weight:850;font-size:22px;margin:10px 0 2px}
.mintro{margin:0;font-size:14px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);margin-top:6px}
.msec{margin-top:16px}
.msec>h2{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:19px;margin:0 0 6px}
.mgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:8px}
.mgroup.fav{border:2px solid var(--accent)}
.mgroup h3{margin:0;padding:8px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--sunk)}
.mgroup.fav h3{color:var(--accent);background:var(--accent-soft)}
.mrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;width:100%;padding:10px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-height:48px}
.mgroup h3+.mrow{border-top:0}
.mrow .nm{font-weight:700;min-width:0}
.mrow .meta{font-size:12px;color:var(--muted);grid-column:1}
.mrow .ht{grid-row:1/span 2;grid-column:2;font-size:22px;line-height:1;color:var(--muted)}
.mrow[aria-pressed="true"] .ht{color:var(--f)}
.mrow[aria-pressed="true"]{background:var(--accent-soft)}
.lk{color:var(--f);font-size:13px;margin-left:4px}
.likes{list-style:none;padding:0;margin:6px 0}
.likes li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.msearch{position:sticky;top:var(--hdr,0px);z-index:3;background:var(--bg);padding:10px 0 6px;display:flex;gap:8px;align-items:center}
.msearch input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.msearch input:focus{outline:2px solid var(--accent);outline-offset:1px}
.mcount{font-size:12px;color:var(--muted);margin:2px 0 0}
.modebar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.modebar:empty{display:none}
.modebar button{border:0;font:inherit;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;cursor:pointer;background:var(--accent-soft);color:var(--accent)}
.settings{margin-top:14px;background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.settings h2{margin:0!important}
.settings h3{margin:4px 0 0;font-size:15px}
.settings .hint{margin:0;font-size:13px;color:var(--muted)}
.swrow{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.swrow small{display:block;font-size:13px;color:var(--muted)}
.swrow input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto}
.macgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.macgrid label{display:grid;gap:2px;font-size:13px;font-weight:700}
.macgrid input{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.macgrid input:focus{outline:2px solid var(--accent);outline-offset:1px}
.setbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.setmsg{margin:0;font-size:13px}
.setmsg.err{color:var(--treat);font-weight:700}
.profgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.profgrid label{display:grid;gap:2px;font-size:13px;font-weight:700;min-width:0}
.profgrid .wide{grid-column:1/-1}
.profgrid input,.profgrid select{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.profgrid input:focus,.profgrid select:focus{outline:2px solid var(--accent);outline-offset:1px}
.ht{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.calc{margin:0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.calc b{font-family:var(--display);font-stretch:85%}
.vtog{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:10px 12px;border-radius:12px;cursor:pointer;white-space:nowrap}
.vtog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.swrow select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);flex:0 1 auto;max-width:55%}
.setup{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:10px;background:var(--bg)}
.setup[open]{gap:12px}
.setup summary{cursor:pointer;font-size:15px}
.setup summary small{color:var(--muted);font-size:13px}
.setup textarea{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;resize:vertical}
.dbox{display:flex;flex-wrap:wrap;gap:4px 9px;font-size:13px}
.dbox label{display:flex;align-items:center;gap:4px;font-weight:600;cursor:pointer}
.dbox input{width:18px;height:18px;accent-color:var(--accent)}
.classes{display:grid;gap:8px}
.clrow{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0;display:grid;gap:6px;background:var(--surface)}
.clrow legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.clgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.clgrid input,.clgrid select{font:inherit;font-size:15px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.clgrid .tm2{grid-column:1/-1;display:flex;align-items:center;gap:6px}
.clrow .linkbtn{justify-self:start}
@media (prefers-reduced-motion:no-preference){.meal{animation:rise .25s ease-out both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="apptitle">Swipewise</h1>
      <div class="fresh" id="fresh">Loading menus…</div>
    </div>
    <div class="days" id="days" role="group" aria-label="Pick a day"></div>

      <button class="tab" role="tab" id="tab-day" data-tab="day" aria-selected="false">My day</button>
      <button class="tab" role="tab" id="tab-j2" data-tab="J2 Dining" aria-selected="true">J2</button>
      <button class="tab" role="tab" id="tab-kins" data-tab="Kins Dining" aria-selected="false">Kins</button>
      <button class="tab" role="tab" id="tab-jcl" data-tab="JCL Dining" aria-selected="false">JCL</button>
      <button class="tab" role="tab" id="tab-plan" data-tab="plan" aria-selected="false">Plan</button>
    </div>
  </header>
  <main id="main" aria-live="polite">
    <p class="empty">Loading this week's menus…</p>
  </main>
</div>

<script>
/* ===================== Coaching logic (pure) ===================== */
const TARGETS = {
  Breakfast: {min:450, max:650, label:'450–650 cal · 25g+ protein'},
  Lunch:     {min:600, max:850, label:'600–850 cal · 30g+ protein'},
  Dinner:    {min:600, max:850, label:'600–850 cal · 30g+ protein'},
  Treat:     {min:650, max:1000, label:'up to ~1,000 cal · still get protein'}
};
// Weekly rhythm: 0=Mon … 6=Sun
const TREATS = { '1|Lunch':'treat', '2|Dinner':'treat', '4|Dinner':'treat', '5|Lunch':'treat', '6|Dinner':'treat' };
const HOURS_KEY = {'J2 Dining':'J2 Dining','Kins Dining':'Kins Dining','JCL Dining':'Jester City Limits'};
const HALLS = ['J2 Dining','Kins Dining','JCL Dining'];

const RX = {
  skipStation: /garden bar|salad bar|chilled|^open$/i,
  condiment: /sauce|dressing|syrup|gravy|salsa|pico|cilantro|crema|glaze|topping|jalape|olive|green onion|sliced onion|red onion|lettuce|romaine|tomato slices|cherry tomato|cheese slices|shredded .*cheese|parmesan|feta|sour cream|margarine|butter|honey|croutons|seeds|giardiniera|pickle|ketchup|mustard|mayo|relish|condiment|cucumber|shredded carrots|diced tomato|green pepper|chopped hard boiled|fresh spinach|broccoli florets|french fried onions|sauteed onions|lime|lemon|hummus|guacamole|whipped|jelly|jam|peanut butter|cream cheese|oatmeal topping|topping bar|nacho toppings|spread|vinaigrette|aioli|chutney|raita|sriracha|hot sauce|kimchi|slaw$/i,
  bread: /\bbun\b|tortilla|naan|pita|\broll\b|bread|breadstick|bagel|english muffin|toast$|croissant/i,
  treat: /pizza|cookie|cake|brownie|cupcake|cheesecake|crisp|donut|doughnut|fries|tater tots|queso|nacho|chips|pasta bake|alfredo|mac (and|&|n) cheese|fried|cinnamon|muffin|\bpie\b|pudding|churro|ice cream|waffle|french toast|pancake|biscuit|sticky bun|bar$|cobbler|tart|danish|scone|sundae|dorito|\bchip|tater tot|corn dog|breaded chicken|nugget|wings|quesadilla|empanada|schnitzel|calzone|stromboli|burger|buffalo|\bbites\b/i,
  fruit: /banana|apple|orange|grape|berr|melon|cantaloupe|honeydew|pineapple|mango|pear|fruit|kiwi|peach|plum/i,
  veg: /broccoli|kale|green bean|vegetable|veggie|cauliflower|brussels|carrot|spinach|zucchini|squash|asparagus|cabbage|\bpeas\b|bok choy|mushroom|collard|edamame|salad|okra|eggplant|peppers|greens|calabacitas|elote|ratatouille|succotash|tomato/i,
  carb: /rice|quinoa|potato|farro|couscous|pasta|noodle|penne|spaghetti|fusilli|farfalle|beans|lentil|\boat|grits|barley|pilaf|corn on the cob|polenta|chickpea|hash brown|tot/i,
  protein: /chicken|turkey|beef|steak|pork|fish|salmon|tilapia|cod|catfish|shrimp|tofu|egg|tempeh|yogurt|carnitas|barbacoa|brisket|meatball|carne|bulgogi|teriyaki|tikka|kebab|gyro|shawarma|ham\b|sausage|patty|chili|masala|dal\b|seitan/i
};

let NOPE=new Set();
function loadNope(){ try{ NOPE=new Set(JSON.parse(localStorage.getItem('vdc-nope')||'[]')); }catch(e){ NOPE=new Set(); } }
function saveNope(){ try{ localStorage.setItem('vdc-nope', JSON.stringify([...NOPE])); }catch(e){} }
function num(x){ return (typeof x==='number' && isFinite(x)) ? x : 0; }
function pieces(portion){ const m=/^(\d+)\s*(each|ea)\b/i.exec(portion||''); return m? +m[1] : 0; }
function servingText(portion){
  const p=(portion||'').trim(); const n=pieces(p);
  if(n>1) return '1 piece';           // UT lists "2 each" but nutrition is per piece
  if(/^1 (each|ea)$/i.test(p)) return '1 serving';
  return p.replace(/ozL$/i,'oz ladle').replace(/ozl$/i,'oz ladle');
}

function itemFrom(rec, num_, station){
  const r = rec[num_]; if(!r) return null;
  return { id:num_, name:r[0].trim(), portion:r[1], serving:servingText(r[1]), legends:r[2],
    cal:num(r[3]), p:num(r[4]), c:num(r[5]), f:num(r[6]), fiber:num(r[7]), sugar:num(r[8]), sod:num(r[9]),
    station: station || '', hasNutrition: typeof r[3]==='number' };
}

function classify(it){
  const n = it.name.toLowerCase(), st = it.station;
  if (it.synthetic) return it.role;
  if (typeof MY!=='undefined' && MY.dislikes && MY.dislikes.test(n)) return 'skip';
  if (NOPE.has(n)) return 'skip';
  if (/dessert|bakery/i.test(st) || /cake|cookie|brownie|cupcake|\bpie\b|crisp|cobbler|pudding|cheesecake|donut|doughnut|muffin|danish|scone|cinnamon roll|s'?mores?|krispie|funfetti/i.test(n)) return 'skip';
  if (RX.skipStation.test(st)) return 'skip';
  if (!it.hasNutrition || it.cal<=0) return 'skip';
  if (/dessert|bakery/i.test(st)) return 'treat';
  if (RX.condiment.test(n) && !(it.p>=12)) return 'skip';
  if (/(chopped|crispy|crumbled) bacon|^bacon$|bacon bits/.test(n)) return 'skip';
  if (RX.bread.test(n)) return 'bread';
  if (/sandwich|\bsub\b|wrap|panini|hoagie|po.?boy|slider/.test(n)) return 'other';
  if (RX.treat.test(n)) return 'treat';
  if (RX.fruit.test(n) && it.cal<=150 && !/yogurt|cake|pie|salad|jackfruit/.test(n)) return 'fruit';
  if (/\bboil\b|sausage/.test(n) && !/patty/.test(n) && RX.veg.test(n)) return 'other';
  if (/(potato|pasta|chicken|tuna|egg|macaroni|orzo|ham|bowtie) salad|panzanella|samosa|dumpling|pot sticker|potsticker|spring roll|egg roll|casserole/.test(n)) return 'other';
  if (/soup|bisque|caldo|chowder|gumbo|stew|chili/.test(n)) return (it.p>=12 && it.cal<=400) ? 'protein' : 'other';
  if (SET().vegan && /bean|lentil|chickpea|garbanzo|edamame|tofu|tempeh|seitan|plant.?based|vegan|falafel|dal\b/i.test(n) && it.p>=5 && it.cal<=450 && !RX.treat.test(n)) return 'protein';
  const leanRatio = it.cal>0 ? (it.p*4)/it.cal : 0;
  if ((it.p>=12 && leanRatio>=0.25 && it.cal<=500) || (RX.protein.test(n) && it.p>=6 && it.cal<=450)) return (it.f > it.p*1.1 && it.cal>150) ? 'other' : 'protein';
  if (RX.veg.test(n) && it.cal<=200) return 'veg';
  if (RX.carb.test(n) && it.cal<=330) return 'carb';
  return 'other';
}

function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }

function scoreFor(role, it){
  switch(role){
    case 'protein': return (it.cal? it.p/it.cal*100 : 0) + Math.min(it.p,35)/4 + Math.min(it.fiber,6)/2
        - (PROC.test(it.name)?9:0) + (FISH.test(it.name)?4:0) + (FUN.test(it.name)?2.5:0)
        - (it.sod>1100?5: it.sod>800?2.5:0) - (it.f>22?2:0) - (it.sugar>12?2:0);
    case 'veg': return Math.min(it.fiber,6) + (/roast|steam|grill|saute|sauté/i.test(it.name)?2:0) - (it.f>12?2:0) - (it.sod>600?2.5:0) - (/bacon/i.test(it.name)?2:0);
    case 'carb': return Math.min(it.fiber,6) + (/brown|quinoa|sweet potato|bean|lentil|farro|oat|whole/i.test(it.name)?3:0) - (it.sugar>8?2:0);
    case 'fruit': return Math.min(it.fiber,3) - (it.sugar>20?1:0);
    case 'treat': return Math.min(it.p,30)/3 + (/pizza|burger|taco|pancake|french toast|waffle|queso|fries|pasta|wings|tender|cake|cookie|brownie/i.test(it.name)?3:0);
    default: return 0;
  }
}

const PROC=/\bham\b|deli|sausage|bacon|pepperoni|salami|hot dog|bratwurst|andouille|chorizo|kielbasa|spam/i;
const FISH=/fish|salmon|tilapia|cod\b|tuna|shrimp|catfish|pollock|trout|mahi/i;
const FUN=/taco|bao|bulgogi|curry|teriyaki|stir.?fry|jerk|shawarma|souvlaki|pho|fajita|burrito|bowl|tikka|kebab|gyro|banh|sushi|poke|ramen|carnitas|barbacoa|tandoori|korean|thai|chipotle|cajun|harissa|moroccan|szechuan|kung pao|orange chicken|lemongrass/i;
const FAMILY=/(chicken|pork|beef|steak|turkey|fish|salmon|tilapia|cod|shrimp|tofu|egg|yogurt|ham|sausage|tempeh|lentil|bean)/i;
function family(name){ const m=FAMILY.exec(name); return m? m[1].toLowerCase() : name.toLowerCase(); }
let CARB_CAP=null; // per-meal carb target while a plate is being built
function carbPenalty(role,c){ if(CARB_CAP==null || role==='carb') return 0; return -Math.max(0,c.c-4)/(role==='protein'?2.5:5); }
function pick(cands, role, r, avoid, opts={}){
  const filtered = cands.filter(c=>c.role===role && !avoid.has(c.name.toLowerCase())
      && (opts.maxCal==null || c.cal<=opts.maxCal) && (!opts.notFamily || family(c.name)!==opts.notFamily)
      && (!opts.filter || opts.filter(c)));
  const pool = filtered.some(c=>c.forced) ? filtered : filtered.some(c=>!c.offMeal) ? filtered.filter(c=>!c.offMeal) : filtered;
  const scored = pool
    .map(c=>({c, s: scoreFor(role,c) + r()*(role==='treat'?9:4) - (c.recent?6:0) + (c.liked && !c.synthetic ? 30 : 0) + carbPenalty(role,c) + (c.forced?1000:0)}))
    .sort((a,b)=>b.s-a.s);
  return scored.length ? scored[0].c : null;
}

function line(it, qty, role){ return {...it, qty, role}; }
function totals(lines){
  const t={cal:0,p:0,c:0,f:0,fiber:0};
  for(const l of lines){ t.cal+=l.cal*l.qty; t.p+=l.p*l.qty; t.c+=l.c*l.qty; t.f+=l.f*l.qty; t.fiber+=l.fiber*l.qty; }
  return t;
}

const ICE_CREAM = {id:'icecream', synthetic:true, role:'dessert', name:'Ice cream', serving:'1 cup (about 2 scoops) · estimate', station:'Hall ice cream if it\'s out, or a single cup from Jester or Kins market',
  portion:'1 cup', legends:'MLK', cal:270, p:5, c:32, f:14, fiber:1, sugar:28, sod:100, hasNutrition:true};
function romaineSalad(items){
  if (typeof MY==='undefined' || !MY.likesRomaine) return null;
  const find=rx=>items.find(i=>rx.test(i.name));
  const rom=find(/chopped romaine/i); if(!rom) return null;
  const parts=[[rom,3],[find(/cherry tomato/i),1],[find(/cucumber/i),1],[find(/shredded carrot/i),1]].filter(x=>x[0]);
  const sum=k=>parts.reduce((a,[it,q])=>a+(it[k]||0)*q,0);
  return {id:'romaine', synthetic:true, role:'veg', name:'Romaine side salad', station:rom.station,
    serving:'3 handfuls romaine + tomato, cucumber · 1 tbsp light dressing', portion:'1 bowl', legends:'VGN',
    cal:Math.round(sum('cal')+45), p:sum('p'), c:sum('c')+2, f:sum('f')+4, fiber:sum('fiber'), sugar:sum('sugar')+1, sod:sum('sod')+150, hasNutrition:true, liked:true};
}

/* Vegan protein add-on: salad/garden bar tofu, edamame, beans and chickpeas, sized to close the protein gap */
function plantAddOn(items, needP){
  if(needP<5) return null;
  const at=rx=>items.find(i=>RX.skipStation.test(i.station||'') && rx.test(i.name) && i.hasNutrition && i.p>0);
  const opts=[[at(/^tofu$/i),4],[at(/^edamame$/i),3],[at(/black beans|kidney beans|pinto beans/i),3],[at(/garbanzo|chickpea/i),3]].filter(x=>x[0]);
  if(!opts.length) return null;
  const parts=[]; let p=0;
  for(let round=0; round<4 && p<needP; round++) for(const o of opts){ if(p>=needP) break; const cur=parts.find(x=>x[0]===o[0]); if(cur){ if(cur[1]>=o[1]) continue; cur[1]++; } else parts.push([o[0],1]); p+=o[0].p; }
  const sum=k=>parts.reduce((a,[it,q])=>a+(it[k]||0)*q,0);
  if(sum('p')<6) return null;   // not worth a trip to the salad bar
  const desc=parts.map(([it,q])=>`${q}× ${it.name.toLowerCase()} (${it.portion})`).join(', ');
  return {id:'plantaddon', synthetic:true, booster:true, role:'protein', name:'Protein add-on from the salad bar', station:parts[0][0].station,
    serving:desc, portion:'1 bowl', legends:'VGN', cal:Math.round(sum('cal')), p:sum('p'), c:sum('c'), f:sum('f'), fiber:sum('fiber'), sugar:sum('sugar'), sod:sum('sod'), hasNutrition:true};
}

function buildPlate(items, meal, kind, r, recentNames, dayUsed, shuffleAvoid, force){
  const avoid = new Set([...dayUsed, ...shuffleAvoid]);
  const seen = new Map();
  const offRx=/breakfast|scramble|hash brown|overnight oats|french toast|waffle|pancake|oatmeal|yogurt|hard boiled/i;
  for(const it of items){ const k=it.name.toLowerCase(); if(!seen.has(k)) seen.set(k,{...it, role:classify(it), recent: recentNames.has(k), offMeal: meal!=='Breakfast' && offRx.test(it.name), forced: !!force && k===force.toLowerCase(), liked: isLiked(k)}); }
  const cands=[...seen.values()];
  const rs = meal!=='Breakfast' ? romaineSalad(items) : null;
  if (rs) cands.push({...rs, recent:false, offMeal:false});
  let T = mealTarget(meal, kind); CARB_CAP = T.c;
  const lowCarb = T.c!=null && T.c<35, carbFit = it=> T.c==null || it.c <= T.c*0.6;
  const lines=[];
  const add=(it,q,role)=>{ if(it){ lines.push(line(it,q,role)); avoid.add(it.name.toLowerCase()); } return it; };
  const isDessert=c=>/dessert|bakery/i.test(c.station) || /cake|cookie|brownie|cupcake|pie|crisp|cobbler|pudding|bar$|treat|donut|muffin|s'?mores?|caramel apple|cinnamon roll|funfetti|nutella|dessert/i.test(c.name);
  const vegan=SET().vegan;
  const addDessert=()=>{ if(!vegan && MY.dessert==='ice cream') add(ICE_CREAM,1,'dessert'); };
  // Vegan: if every protein was already used today, allow a repeat rather than an empty plate
  const pickP=()=> pick(cands,'protein',r,avoid,{filter:c=>!c.booster}) || (vegan ? pick(cands,'protein',r,new Set(shuffleAvoid),{filter:c=>!c.booster}) : null);
  const veganTopUp=(goal)=>{
    if(!vegan) return;
    const have=()=>totals(lines).p;
    if(have() < goal-3 && lines.filter(l=>l.role==='protein').length<2){
      const fam=(lines.find(l=>l.role==='protein')||{}).name;
      const p2=pick(cands,'protein',r,avoid,{notFamily:fam&&family(fam), maxCal:300, filter:c=>!c.booster && (meal==='Breakfast' || !c.offMeal)});
      if(p2 && p2.p>=6) add(p2,1,'protein');
    }
    if(have() < goal-3){ const b=plantAddOn(items, goal-have()); if(b) add(b,1,'protein'); }
  };

  if (kind==='treat'){
    const t = pick(cands,'treat',r,avoid,{filter:c=>!isDessert(c) && c.cal<=750});
    if(!t){ kind='normal'; T=mealTarget(meal, kind); }
    else {
      const per=t.cal; const two=(/pizza/i.test(t.name)||pieces(t.portion)>1||/pancake/i.test(t.name)) && per<=330;
      add(t, two?2:1, 'treat');
      if (/burger|patty/i.test(t.name)){ const bun=cands.find(c=>c.role==='bread'&&/bun/i.test(c.name)); add(bun,1,'side'); }
      if (totals(lines).p < 15 && !vegan){ const pr=pick(cands,'protein',r,avoid,{maxCal:260, filter:c=>!c.booster}); add(pr, pr && pr.p<14 && pr.cal<200 ? 2:1, 'protein'); }
      veganTopUp(Math.min(T.p, 20));
      add(rs || pick(cands,'veg',r,avoid),1,'veg');
      if (meal!=='Breakfast') addDessert();
      return finish(lines, T, kind, cands, r, avoid, meal);
    }
  }

  if (meal==='Breakfast'){
    const p1 = pickP(); add(p1, p1 && p1.p<12 && p1.cal<=200 ? 2:1, 'protein');
    if (totals(lines).p < 22){ const p2=pick(cands,'protein',r,avoid,{notFamily:p1&&family(p1.name), maxCal:250}); add(p2, p2 && p2.p<10 && p2.cal<=180 ? 2:1, 'protein'); }
    veganTopUp(T.p);
    if(!lowCarb){ const carb = pick(cands,'carb',r,avoid,{filter:carbFit}); add(carb, carb && carb.cal<100 && (T.c==null || carb.c*2<=T.c*0.6) ? 2:1, 'carb'); }
    if(T.c==null || T.c>=25) add(pick(cands,'fruit',r,avoid,{filter:carbFit}),1,'fruit');
  } else {
    const p1 = pickP();
    add(p1, p1 && p1.p<22 && p1.p*2<=48 && p1.cal<=230 ? 2:1, 'protein');
    if (p1 && totals(lines).p < 20){ const p2=pick(cands,'protein',r,avoid,{notFamily:family(p1.name), maxCal:220, filter:c=>!c.offMeal && !c.booster && /egg|bean|lentil|tofu|tempeh|edamame|chickpea/i.test(c.name)}) || pick(cands,'protein',r,avoid,{notFamily:family(p1.name), maxCal:220, filter:c=>!c.offMeal && !c.booster}); add(p2,1,'protein'); }
    veganTopUp(T.p);
    if (rs) add(rs,1,'veg');
    add(pick(cands,'veg',r,avoid),1,'veg');
    if(!lowCarb) add(pick(cands,'carb',r,avoid,{filter:carbFit}),1,'carb'); else add(pick(cands,'veg',r,avoid),1,'veg');
  }
  if (kind==='dessert') addDessert();
  return finish(lines, T, kind, cands, r, avoid, meal);
}

function finish(lines, T, kind, cands, r, avoid, meal){
  const count=role=>lines.filter(l=>l.role===role).length;
  const lowCarb = T.c!=null && T.c<35;
  const max = kind==='dessert' ? T.max+350 : T.max;
  let t=totals(lines), guard=0;
  while(t.cal < T.min && guard++ < 6){
    let extra=null;
    const room = it=> T.c==null || t.c + it.c <= T.c*1.1;
    if (count('veg')<(lowCarb?3:2)) extra=pick(cands,'veg',r,avoid,{filter:room});
    if (!extra && meal==='Breakfast' && count('fruit')<2) extra=pick(cands,'fruit',r,avoid,{filter:room});
    if (extra){ lines.push(line(extra,1,extra.role)); avoid.add(extra.name.toLowerCase()); t=totals(lines); continue; }
    const pl=lines.find(l=>l.role==='protein' && !l.booster && l.qty<(lowCarb?3:2) && l.cal<=300 && l.p*2<=50 && room(l));
    const cl=lines.find(l=>l.role==='carb' && l.qty<2 && l.cal<=250 && room(l));
    let p2=null;
    if (!pl && count('protein')<2 && kind!=='treat'){ const fam=(lines.find(l=>l.role==='protein')||{}).name; const lite={notFamily:fam&&family(fam),maxCal:300};
      if (T.c!=null) p2=pick(cands,'protein',r,avoid,{...lite, filter:c=>(meal==='Breakfast' || !c.offMeal) && room(c)});
      if (!p2)
      p2=pick(cands,'protein',r,avoid,{...lite, filter:c=>(meal==='Breakfast' || !c.offMeal) && /yogurt|egg|bean|lentil|tofu|tempeh|edamame|chickpea|plant|vegan|veggie/i.test(c.name)}); }
    if (pl){ pl.qty++; }
    else if (p2){ lines.push(line(p2,1,'protein')); avoid.add(p2.name.toLowerCase()); }
    else if (cl){ cl.qty++; }
    else if (count('fruit')<1 && !lowCarb){ const f=pick(cands,'fruit',r,avoid,{filter:room}); if(f){ lines.push(line(f,1,'fruit')); avoid.add(f.name.toLowerCase()); } else break; }
    else break;
    t=totals(lines);
  }
  guard=0;
  while(t.p < T.p-4 && t.cal < max-120 && guard++ < 3){ const pl=lines.find(l=>l.role==='protein' && !l.booster && l.qty<3 && l.p>=8 && l.cal<=300 && (T.c==null || t.c+l.c<=T.c*1.1)); if(!pl) break; pl.qty++; t=totals(lines); }
  guard=0;
  while(t.cal > max && guard++ < 6){
    const tq=lines.find(l=>l.role==='treat' && l.qty>1);
    let i=-1;
    const pq = kind==='treat' ? lines.find(l=>l.role==='protein' && l.qty>1) : null;
    if(tq){ tq.qty--; }
    else if(pq){ pq.qty--; }
    else if((i=lines.findIndex(l=>l.role==='protein' && !l.booster && kind==='treat' && lines.some(x=>x.role==='treat')))>=0){ lines.splice(i,1); }
    else if(kind==='treat' && lines.some(l=>l.booster) && (i=lines.findIndex(l=>l.role==='veg'))>=0 && t.cal-max>40){ lines.splice(i,1); }
    else if((i=lines.findIndex(l=>l.role==='dessert' && kind==='treat'))>=0 && lines.length>3){ lines.splice(i,1); }
    else {
      const q = lines.find(l=>l.role==='carb' && l.qty>1) || lines.find(l=>l.role==='treat' && l.qty>1) || lines.find(l=>l.role==='protein' && l.qty>1);
      if(q) q.qty--;
      else { i=lines.findIndex(l=>l.role==='carb' || l.role==='fruit'); if(i>=0) lines.splice(i,1); else break; }
    }
    t=totals(lines);
  }
  return {lines, t, kind, target:T};
}

function plateScore(p, meal){
  const t=p.t; let sod=0, sug=0, proc=0, fish=0, fun=0, meats=0;
  for(const l of p.lines){ sod+=l.sod*l.qty; if(!/fruit/.test(l.role) && !/yogurt|milk/i.test(l.name)) sug+=l.sugar*l.qty;
    if(PROC.test(l.name)) proc++; if(FISH.test(l.name)) fish++; if(FUN.test(l.name)) fun++; if(l.role==='protein' && !l.booster && !/yogurt|egg|bean|lentil|tofu|tempeh|plant|vegan|veggie/i.test(l.name)) meats++; }
  const T=p.target, mid=(T.min+T.max)/2, treat=p.kind==='treat';
  const pMin = T.p;
  let s = Math.abs(t.cal-mid)/60 + Math.max(0,t.cal-T.max)/25 + Math.max(0,T.min-t.cal)/40;
  s += Math.max(0, sod-(treat?1600:1100))/120;
  s += Math.max(0, pMin-t.p)*0.6 + Math.max(0, t.p-Math.max(60, pMin*1.6))*0.25;
  if(T.c!=null) s += Math.max(0, t.c-T.c*1.1)/(treat?6:2) + Math.max(0, T.c*0.5-t.c)/12;
  if(T.f!=null) s += Math.max(0, t.f-T.f*1.1)/(treat?6:3) + Math.max(0, T.f*0.6-t.f)/8;
  s += treat? 0 : Math.max(0, (meal==='Breakfast'?5:8)-t.fiber)*0.8;
  s += treat? 0 : Math.max(0, sug-15)*0.25;
  s += (treat?0:proc*4) + Math.max(0,meats-1)*3 - fish*2 - fun*1.5 - (p.lines.some(l=>l.liked && l.synthetic)?2:0) - p.lines.filter(l=>l.liked && !l.synthetic).length*6;
  return s;
}
function bestPlate(items, meal, kind, seed, recent, dayUsed, avoid, force){
  let best=null, bestS=Infinity;
  for(let k=0;k<10;k++){
    const p=buildPlate(items, meal, kind, rng(hashStr(seed+'#v'+k)), recent, dayUsed, avoid, force);
    if(force && !p.lines.some(l=>l.name.toLowerCase()===force.toLowerCase())) continue;
    if(!p.lines.some(l=>l.role==='protein'||l.role==='treat')) return {...p, lines:[], t:totals([])};
    const sc=plateScore(p, meal); if(sc<bestS){ best=p; bestS=sc; }
  }
  return best || (force ? null : {lines:[], t:totals([]), kind, target:mealTarget(meal, kind)});
}

let DATA=null; const MEMO=new Map(); const SHUFFLE=new Map();
function weekdayIdx(dateStr){ const [m,d,y]=dateStr.split('/').map(Number); return (new Date(y,m-1,d).getDay()+6)%7; }
function kindFor(dateStr, meal){ return TREATS[weekdayIdx(dateStr)+'|'+meal] || 'normal'; }
function menuVegan(){ return state.menuVegan==null ? SET().vegan : state.menuVegan; }
function mealItems(hall, date, meal, vg){
  const day=DATA.days[date]; if(!day||!day[hall]||!day[hall][meal]) return [];
  const v= vg==null ? SET().vegan : vg;
  return day[hall][meal].map(([st,n])=>itemFrom(DATA.rec,n,st)).filter(it=>it && (!v || /\bVGN\b/.test(it.legends||'')));
}
function dayPlan(hall, date){
  const key=hall+'|'+date; if(MEMO.has(key)) return MEMO.get(key);
  const dates=Object.keys(DATA.days); const i=dates.indexOf(date);
  const recent=new Set();
  for(const back of [1,2]){ if(i-back>=0){ const prev=dayPlan(hall,dates[i-back]); for(const m in prev) for(const l of prev[m].lines) if(l.role!=='fruit') recent.add(l.name.toLowerCase()); } }
  const plan={}; const dayUsed=new Set();
  for(const meal of ['Breakfast','Lunch','Dinner']){
    const items=mealItems(hall,date,meal); if(!items.length) continue;
    const p=bestPlate(items, meal, kindFor(date,meal), key+'|'+meal, recent, dayUsed, new Set());
    p.lines.forEach(l=>{ if(l.role==='protein'||l.role==='treat'||l.role==='dessert') dayUsed.add(l.name.toLowerCase()); });
    plan[meal]=p;
  }
  MEMO.set(key,plan); return plan;
}
function mealPlan(hall,date,meal){
  const base=dayPlan(hall,date)[meal]; if(!base) return null;
  const n=SHUFFLE.get(hall+'|'+date+'|'+meal)||0; if(!n) return base;
  const avoid=new Set(); // steer away from what was shown before
  let shown=base;
  for(let k=1;k<=n;k++){
    shown.lines.filter(l=>l.role==='protein'||l.role==='treat').forEach(l=>avoid.add(l.name.toLowerCase()));
    const sd=hall+date+meal+'#'+k;
    let next=bestPlate(mealItems(hall,date,meal), meal, kindFor(date,meal), sd, new Set(), new Set(), avoid);
    if(!next.lines.some(l=>l.role==='protein'||l.role==='treat')){ avoid.clear(); next=bestPlate(mealItems(hall,date,meal), meal, kindFor(date,meal), sd, new Set(), new Set(), new Set()); }
    shown=next;
  }
  return shown;
}

  if(!a||!b) return 0;

  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLon=toR(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;

  return Math.max(1, Math.ceil(meters/80));         // ~80 m per minute walking

function optionsFor(slot, wi, date, ignorePick){
  const list = slot.meal==='Snack' ? SNACKS : SPOTS;
  const out=[];
  for(const sp of list){
    const w1=walkMin(slot.from, sp), w2=walkMin(sp, slot.to);
    const arrive=slot.start+w1, leave=slot.end-w2, eat=leave-arrive;
    if(SET().vegan && !sp.hall && slot.meal!=='Snack' && !pickFor(sp, slot.meal)) continue;
    const need = slot.meal==='Snack'? 10 : 20;
    if(eat<need) continue;
    // open window: earliest time he could start eating there
    const range=spotHours(sp, wi); let ok=false, at=arrive;
    for(let t=arrive; t+need<=leave; t+=5){ if(openDuring(range,t,t+need)){ ok=true; at=t; break; } }
    if(!ok) continue;
    let plan=null;
    if(sp.hall && slot.meal!=='Snack'){ plan = (DATA.days[date] && DATA.days[date][sp.hall]) ? (ignorePick ? mealPlan(sp.hall, date, slot.meal) : planFor(sp.hall, date, slot.meal)) : null; if(plan && !plan.lines.length) continue; }
    const pk = ignorePick ? null : getPick(date, slot.meal);
    const picked = !!pk && ((pk.hall && pk.hall===sp.hall) || (pk.spot && pk.spot===sp.name));
    const fav = !pk && MY.favorites[wi+'|'+slot.meal]===sp.name;
    const travel=w1+w2;
    const score = (picked?-200:0) + (fav?-100:0) + travel + (sp.hall?0:6) + (sp.hall && !plan ? 4 : 0) + (!sp.hall && SET().vegan ? 6 : 0);
    out.push({sp, w1, w2, at, eat:leave-at, plan, fav, picked, score, range});
  }
  return out.sort((a,b)=>a.score-b.score);
}
function pickFor(sp, meal){ const p=(SET().vegan ? sp.vegan : sp.picks)||{}; return p[meal]||p.any||null; }

function planFor(hall, date, meal){
  const pk=getPick(date, meal);
  if(pk && pk.hall===hall && pk.name){ const p=forcedPlate(hall,date,meal,pk.name); if(p && p.lines.length) return p; }
  return mealPlan(hall, date, meal);
}
function choicesFor(slot, wi, date){
  const kind=kindFor(date, slot.meal), role= kind==='treat' ? 'treat' : 'protein';
  const opts=optionsFor(slot, wi, date, true).filter(o=>o.sp.hall && o.plan && o.plan.lines.length);
  const pool=[];
  for(const o of opts){
    const items=mealItems(o.sp.hall, date, slot.meal); const seen=new Set();
    for(const it of items){
      const k=it.name.toLowerCase(); if(seen.has(k)) continue; seen.add(k);
      const c={...it, role:classify(it)}; if(c.role!==role) continue;
      if(role==='protein' && (c.cal>500 || (slot.meal!=='Breakfast' && /breakfast|scramble|yogurt|hard boiled|oatmeal/i.test(c.name)))) continue;
      if(role==='treat' && (c.cal>750 || /cake|cookie|pie|brownie|bar$|s'?more|cinnamon/i.test(c.name) || (slot.meal!=='Breakfast' && /waffle|pancake|french toast|biscuit|donut/i.test(c.name)))) continue;
      const appeal = scoreFor(role,c) + (FUN.test(c.name)?5:0) + (/burger|pizza|taco|wings|tender|fries|queso|nacho|bao|bowl|teriyaki|bbq|grill/i.test(c.name)?2:0)
        - (role==='protein' && PROC.test(c.name)?10:0) - (o.w1+o.w2)/3 + (isLiked(c.name)?40:0);
      pool.push({hall:o.sp.hall, spot:o.sp, w1:o.w1, w2:o.w2, name:it.name.trim(), appeal, fam:family(it.name), liked:isLiked(it.name)});
    }
  }
  pool.sort((a,b)=>b.appeal-a.appeal);
  const out=[], fams=new Set(), perHall={};
  for(const c of pool){
    if(out.length>=3) break;
    if(fams.has(c.fam) || (perHall[c.hall]||0)>=2 || out.some(o=>niceName(o.name)===niceName(c.name))) continue;
    const plate=forcedPlate(c.hall, date, slot.meal, c.name); if(!plate || !plate.lines.length) continue;
    out.push({...c, plate, kind}); fams.add(c.fam); perHall[c.hall]=(perHall[c.hall]||0)+1;
  }
  const favName=MY.favorites[wi+'|'+slot.meal];
  if(favName && (!SET().vegan || pickFor(SPOTS.find(x=>x.name===favName)||{}, slot.meal))){ const sp=SPOTS.find(x=>x.name===favName); const o=optionsFor(slot,wi,date,true).find(x=>x.sp.name===favName);
    if(sp && o) out.unshift({hall:null, spot:sp, w1:o.w1, w2:o.w2, name:favName, restaurant:true, pick:pickFor(sp,slot.meal), kind}); }
  return out.slice(0,3);
}

/* ===================== Weather: daily high/low for UT Austin (Open-Meteo, free, no key) ===================== */
let WX={};
const WX_URL='https://api.open-meteo.com/v1/forecast?latitude=30.2849&longitude=-97.7341&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FChicago&forecast_days=16';
async function loadWx(){
  let cached=null;
  try{ cached=JSON.parse(localStorage.getItem('vdc-wx')||'null'); }catch(e){}
  if(cached && cached.days){ WX=cached.days; renderDays(); }
  if(cached && Date.now()-cached.at < 3*3600e3) return;   // refresh at most every 3 hours
  try{
    const r=await fetch(WX_URL); if(!r.ok) return; const j=await r.json(); const dd=j.daily||{}; const out={};
    (dd.time||[]).forEach((iso,i)=>{ const [y,m,d]=iso.split('-'); const hi=dd.temperature_2m_max[i], lo=dd.temperature_2m_min[i];
      if(hi!=null && lo!=null) out[`${m}/${d}/${y}`]=[Math.round(hi),Math.round(lo)]; });
    if(!Object.keys(out).length) return;
    WX=out; try{ localStorage.setItem('vdc-wx', JSON.stringify({at:Date.now(), days:out})); }catch(e){}
    if(DATA) renderDays();
  }catch(e){ /* offline: keep whatever we had */ }
}

function renderMeal(hall, date, meal){
  const pk=getPick(date,meal); const usePick = pk && pk.hall===hall && !SHUFFLE.get(hall+'|'+date+'|'+meal);

    ));

  card.append(ul);
  const t=plan.t; const kcalP=t.p*4, kcalC=t.c*4, kcalF=t.f*9, sum=kcalP+kcalC+kcalF||1;
  card.append(el('div',{class:'total'},
    el('div',{class:'big'}, r0(t.cal), el('small',{style:'font-size:12px;font-weight:600;margin-left:3px'},'cal')),
    el('div',{class:'bar',role:'img','aria-label':`Protein ${r0(t.p)} grams, carbs ${r0(t.c)} grams, fat ${r0(t.f)} grams`},
      el('span',{style:`width:${kcalP/sum*100}%;background:var(--p)`}), el('span',{style:`width:${kcalC/sum*100}%;background:var(--c)`}), el('span',{style:`width:${kcalF/sum*100}%;background:var(--f)`})),

    el('button',{class:'btn',id:`shuffle-${meal}`,onclick:()=>{ const key=hall+'|'+date+'|'+meal; SHUFFLE.set(key,(SHUFFLE.get(key)||0)+1); render(); }},'Show another option')));

const TIPS_BASE=[
  ['Walk it','Walking to class counts. Aim for 8,000–10,000 steps a day. Campus makes it easy.'],
  ['Drink water','Soda, sweet tea and juice are the easiest calories to cut. Refill a water bottle before every class.'],
  ['Late nights','Late-night snacking is where the extra calories sneak in. Plan it: fruit, Greek yogurt or a protein shake instead of a second dinner.'],
  ['Sleep','Short sleep makes you hungrier the next day. Aim for 7–9 hours, even on weekends.'],
  ['No skipping','Skipping breakfast usually means overeating at lunch. Even a quick protein and fruit counts.'],
  ['Weigh in weekly','Once a week, same morning, same scale. Daily numbers bounce around and do not mean much.'],
  ['Slow down','Put the fork down between bites. It takes about 20 minutes for your stomach to tell your brain you are full.'],
  ['Get moving','Two or three sessions a week at Greg (Gregory Gym) speed things up and help keep muscle while you lose fat.']
];
function tips(){
  const st=SET(), vg=st.vegan;
  return TIPS_BASE.filter(([h])=> st.goal==='lose' || h!=='Weigh in weekly').map(([h,t])=>{
    if(h==='Late nights') return [h, 'Late-night snacking is where the extra calories sneak in. Plan it: fruit, '+(vg?'soy yogurt, roasted chickpeas or a soy-milk shake':'Greek yogurt or a protein shake')+' instead of a second dinner.'];
    if(h==='Get moving' && st.goal==='build') return [h,'Three or four strength sessions a week at Greg (Gregory Gym), and protein at every meal so the work turns into muscle.'];
    if(h==='Get moving' && st.goal==='maintain') return [h,'Two or three workouts a week at Greg (Gregory Gym) help energy, sleep and focus.'];
    return [h,t];
  });
}

function fmtUpdated(){ const u=DATA.updated||''; const m=/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(u); if(!m) return u; const d=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]); return d.toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }


function nowMinutes(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function nowCard(date){
  if(date!==todayStr()) return null;
  const wi=weekdayIdx(date), now=nowMinutes();
  const {cl, slots}=mealSlots(wi);
  let list=slots;
  if(!cl.length){
    const home=MY.buildings[MY.home];
    list=[{meal:'Breakfast',start:9*60,end:11*60},{meal:'Lunch',start:11*60,end:14*60},{meal:'Dinner',start:16*60+30,end:20*60+30}]
      .map(x=>({...x, from:home, fromName:homeName(), to:home, toName:homeName()}));
  }
  list=list.filter(s=>s.meal!=='Snack' || (now>=s.start && now<s.end));
  let cur=list.find(s=>now>=s.start && now<s.end-15), label, sub;
  if(cur){ label='Right now'; sub=`until ${fmt(cur.end)}`; cur={...cur, start:Math.max(cur.start, now)}; }
  else { cur=list.find(s=>s.start>now); if(!cur) return el('div',{class:'tip'}, el('b',{},'Done for today'), 'No more meals planned. If you get hungry late, keep it light: fruit, '+(SET().vegan?'soy yogurt or a soy-milk shake.':'Greek yogurt or a protein shake.'));
    const mins=cur.start-now; label='Next up'; sub= mins<60 ? `in ${mins} min` : `at ${fmt(cur.start)}`; }
  const card=slotCard(cur, wi, date);
  card.classList.add('now');
  card.prepend(el('div',{class:'eyebrow'}, el('span',{},label), el('span',{},sub)));
  const alts=card.querySelector('.alts'); if(alts) alts.remove();
  return card;
}

function picksCard(date){

  if(!meals.length) return null;
  const rows=meals.map(s=>({s, ch:choicesFor(s, wi, date)})).filter(x=>x.ch.length>=2);
  if(!rows.length) return null;
  const allPicked=rows.every(x=>getPick(date,x.s.meal));
  const card=el('section',{class:'picks','aria-label':'Pick your meals'});
  const head=el('div',{class:'pk-head'}, el('div',{}, el('h2',{}, isToday? "Pick today's meals" : `Plan ${dayLabel(date).dow}'s meals`),
    el('p',{}, 'Tap what sounds good. The app adds sides to keep it balanced.')));

    const ul=el('ul',{class:'pk-sum'});

      const sub = c.restaurant ? (c.pick? `${c.pick.cal} cal · ${c.pick.p} protein` : 'Dine In Dollars') : `${r0(c.plate.t.cal)} cal · ${r0(c.plate.t.p)}g protein`;
      const where = (c.restaurant? c.spot.name : c.hall.replace(' Dining','')) + ` · ${c.w1} min walk`;
      grid.append(el('button',{class:'pk-opt'+(sel?' on':''),role:'radio','aria-checked':String(!!sel),id:`pk-${s.meal}-${hashStr(c.name+(c.hall||''))}`,
        onclick:()=>{ setPick(date, s.meal, c.restaurant? {spot:c.spot.name, name:c.spot.name} : {hall:c.hall, name:c.name}); state.pickOpen=!rows.every(x=>getPick(date,x.s.meal)); render(); }},
        el('span',{class:'pk-name'}, c.restaurant? `${c.spot.name.replace(' Cafe','')} breakfast` : niceName(c.name), c.liked? el('span',{class:'lk','aria-label':'one of your likes'},'♥'):null),
        el('span',{class:'pk-with'}, c.restaurant? (c.pick? c.pick.text.split(/[.;]/)[0] : '') : 'with '+c.plate.lines.filter(l=>l.name!==c.name && l.role!=='side').slice(0,3).map(l=>niceName(l.name).toLowerCase()).join(', ')),

    card.append(grp);

  if(allPicked) card.append(el('button',{class:'btn',onclick:()=>{ state.pickOpen=false; render(); }},'Done'));

/* ===================== Likes (shared when the page allows it, else this phone) ===================== */
let LOCAL=new Map(), REMOTE=null, DB=null, DB_WRITE=null, MIGRATED=false; const WQ={};
function likeKey(n){ return String(n).trim().toLowerCase(); }
function likeId(k){ return k.replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,120)||'item'; }
function loadLikes(){ try{ const a=JSON.parse(localStorage.getItem('vdc-likes')||'[]'); LOCAL=new Map(a.filter(x=>x&&x.name).map(x=>[likeKey(x.name),x])); }catch(e){ LOCAL=new Map(); } LCACHE=null; }
function saveLikes(){ try{ localStorage.setItem('vdc-likes', JSON.stringify([...LOCAL.values()])); }catch(e){} }
function shared(){ return !!(REMOTE && DB_WRITE!==false); }
let LCACHE=null;
function likesMap(){ if(LCACHE) return LCACHE; if(shared()) return (LCACHE=REMOTE); const m=new Map(LOCAL); if(REMOTE) for(const [k,v] of REMOTE) if(!m.has(k)) m.set(k,v); return (LCACHE=m); }
function isLiked(n){ return likesMap().has(likeKey(n)); }
function likedList(){ return [...likesMap().values()].sort((a,b)=>String(b.at||'').localeCompare(String(a.at||''))); }
function likesChanged(){ LCACHE=null; MEMO.clear(); forcedCache.clear(); render(); }
function writeRemote(k, val){
  if(!DB || DB_WRITE===false) return;
  const id=likeId(k);
  WQ[id]=(WQ[id]||Promise.resolve()).then(async()=>{
    const ref=DB.collection('likes').doc(id);
    try{ if(val) await ref.set(val); else await ref.delete(); }
    catch(e){ if(e && (e.code==='invalid_argument' || e.code==='permission_denied')){ DB_WRITE=false; render(); } }
  });
}
function toggleLike(name, hall){
  const k=likeKey(name); const on=!isLiked(name);
  if(!on && REMOTE && REMOTE.has(k) && !shared() && !LOCAL.has(k)){ toast('That one was added from another account, so it can only be removed there.'); return; }
  LCACHE=null;
  if(on){ const v={name:String(name).trim(), hall:hall||'', at:new Date().toISOString()}; LOCAL.set(k,v); NOPE.delete(k); saveNope(); if(shared()){ REMOTE.set(k,v); } writeRemote(k,v); }
  else { LOCAL.delete(k); if(shared()) REMOTE.delete(k); writeRemote(k,null); }
  LCACHE=null; saveLikes(); likesChanged();
}
function syncNote(){
  const n=likedList().length;
  if(shared()) return el('p',{class:'sync'}, `${n} like${n===1?'':'s'} saved to the shared list${MY.checkIn?', so '+MY.checkIn+' sees them too':''}.`);
  const box=el('p',{class:'sync'}, `${n} like${n===1?'':'s'} saved on this phone. `);
  if(n) box.append(el('button',{class:'linkbtn',onclick:shareLikes},MY.checkIn ? 'Send my list to '+MY.checkIn : 'Share my list'));
  return box;
}
async function shareLikes(){
  const text=whose()+" dining hall likes:\n"+likedList().map(x=>'- '+niceName(x.name)+(x.hall?' ('+x.hall.replace(' Dining','')+')':'')).join('\n');
  try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e && e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('Copied. Paste it into a text'+(MY.checkIn?' to '+MY.checkIn:'')+'.'); }catch(e){ toast('Could not open sharing on this device.'); }
}
async function initSync(){
  try{
    if(typeof window==='undefined' || !window.claude || !window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db) return; DB=db;
    if(user){ try{ const c=await user.can('data.write'); if(c===true||c===false) DB_WRITE=c; }catch(e){} }
    db.doc('settings/main').onSnapshot(snap=>{ SET_SHARED = snap.exists ? (snap.data()||null) : null; settingsChanged(); }, ()=>{});
    db.collection('likes').onSnapshot(snap=>{
      const m=new Map();
      for(const d of snap.docs){ const v=d.data(); if(v && typeof v.name==='string' && v.name.trim()) m.set(likeKey(v.name), {name:v.name.trim().slice(0,120), hall:typeof v.hall==='string'?v.hall.slice(0,40):'', at:typeof v.at==='string'?v.at:''}); }
      REMOTE=m; LCACHE=null;
      if(!MIGRATED && DB_WRITE===true){ MIGRATED=true; const missing=[...LOCAL].filter(([k])=>!m.has(k)); if(missing.length) setTimeout(()=>{ for(const [k,v] of missing){ REMOTE.set(k,v); writeRemote(k,v); } LCACHE=null; likesChanged(); },0); }
      likesChanged();
    }, ()=>{});
  }catch(e){}
}

/* ===================== Full menu page ===================== */
function menuItems(hall, date, meal){
  const seen=new Set(), out=[];
  for(const it of mealItems(hall,date,meal,menuVegan())){
    const k=likeKey(it.name); if(seen.has(k)) continue; seen.add(k);
    if(RX.skipStation.test(it.station)) continue;
    if(!it.hasNutrition || it.cal<=0) continue;
    if(RX.condiment.test(it.name.toLowerCase()) && !(it.p>=12)) continue;
    if(/(chopped|crispy|crumbled) bacon|^bacon$|bacon bits/i.test(it.name)) continue;
    out.push(it);
  }
  return out;
}
function menuLikedCount(hall,date){ const s=new Set(); for(const m of ['Breakfast','Lunch','Dinner']) for(const it of menuItems(hall,date,m)) if(isLiked(it.name)) s.add(likeKey(it.name)); return s.size; }
function menuRow(it, hall, top, where){

  return el('button',{class:'mrow','aria-pressed':String(on),id:'like-'+(where?'x-':top?'top-':'')+it.id,

function qMatch(q){ const words=q.toLowerCase().split(/\s+/).filter(Boolean); return it=>{ const hay=(it.name+' '+(it.station||'')).toLowerCase(); return words.every(w=>hay.includes(w)); }; }
function fillMenu(body){
  body.textContent='';
  const hall=state.hall, date=state.date, {dow,d}=dayLabel(date);
  const q=(state.q||'').trim(); const ok=q? qMatch(q) : ()=>true;
  const day=(DATA.days[date]||{})[hall]||{}; let any=false, shown=0;
  for(const meal of ['Breakfast','Lunch','Dinner']){
    if(!day[meal]) continue;
    const all=menuItems(hall,date,meal); if(all.length) any=true;
    const items=all.filter(ok); if(!items.length) continue; shown+=items.length;
    const sec=el('section',{class:'msec','aria-label':meal+' menu'}, el('h2',{}, meal));
    const liked=items.filter(it=>isLiked(it.name));
    if(liked.length){ const g=el('div',{class:'mgroup fav'}, el('h3',{},'Your likes on this menu')); liked.forEach(it=>g.append(menuRow(it,hall,true))); sec.append(g); }
    const by=new Map(); for(const it of items){ const st=it.station||'Other'; if(!by.has(st)) by.set(st,[]); by.get(st).push(it); }
    for(const [st,list] of by){ const g=el('div',{class:'mgroup'}, el('h3',{}, st)); list.forEach(it=>g.append(menuRow(it,hall))); sec.append(g); }
    body.append(sec);
  }
  if(!any){ body.append(el('p',{class:'empty'}, 'No menu posted for this day yet.')); }
  if(!q) return;
  if(!shown) body.prepend(el('p',{class:'empty'}, `Nothing matching "${q}" at ${hall.replace(' Dining','')} on ${dow} ${d}.`));
  else body.prepend(el('p',{class:'mcount'}, `${shown} match${shown===1?'':'es'} at ${hall.replace(' Dining','')} on ${dow} ${d}`));
  // the rest of the week, every hall: one row per dish, with where and when
  const found=new Map();
  for(const ds of Object.keys(DATA.days)) for(const h of HALLS){
    if(ds===date && h===hall) continue;
    for(const meal of ['Breakfast','Lunch','Dinner']){
      if(!((DATA.days[ds]||{})[h]||{})[meal]) continue;
      for(const it of menuItems(h,ds,meal)){ if(!ok(it)) continue; const k=likeKey(it.name);
        if(!found.has(k)) found.set(k,{it, hall:h, where:[]});

function macroCal(st){ return (st.p && st.c && st.f) ? st.p*4+st.c*4+st.f*9 : null; }

const nf=n=>Math.round(n).toLocaleString('en-US');
const r5=x=>Math.round(x/5)*5, r50=x=>Math.round(x/50)*50;

function mealTarget(meal, kind){
  const st=SET(), sh=SHARE[meal]||.35, base=TARGETS[meal]||TARGETS.Lunch, cal=dailyCal(st);
  const g=GOAL_DEF[st.goal]||GOAL_DEF.lose;

  const c = st.c ? Math.round(st.c*sh) : null, f = st.f ? Math.round(st.f*sh) : null;

function calcTargets(pr, goal){
  const kg=pr.lb*0.4536, cm=pr.htIn*2.54, male=pr.sex==='m';

  let cal=r50(deficit ? Math.max(tdee-deficit, Math.min(floor, tdee-150)) : tdee+surplus);
  let p=r5(Math.min(goal==='build'?200:190, Math.max(80, pr.lb*(goal==='build'?0.9:0.8))));

  if(dailyCal(st)||st.p||st.c||st.f) m.append(el('button',{id:'mode-targets',onclick:go}, 'Custom targets'+(dailyCal(st)?' · '+nf(dailyCal(st))+' cal':'')+(st.p?' · '+st.p+'g P':'')));
  if(!m.childNodes.length) m.append(el('button',{id:'mode-settings',onclick:go},'⚙ Macros & vegan mode'));
}

function render(){
  const ttl=document.getElementById('apptitle'); if(ttl) ttl.textContent = 'Swipewise';
  renderModeBar();
  renderDays();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===state.hall)));
  if(state.hall==='plan') renderPlan(); else if(state.hall==='day') renderDay(); else if(state.menu) renderMenu(); else renderHall();
}
function save(){ try{ localStorage.setItem('vdc-hall',state.hall); }catch(e){} }

function importSetupLink(){
  try{
    const h=location.hash||''; if(!h.startsWith('#setup=')) return;
    const b=h.slice(7).replace(/-/g,'+').replace(/_/g,'/');
    const txt=decodeURIComponent(escape(atob(b + '==='.slice((b.length+3)%4))));
    const o=JSON.parse(txt);
    const clean=cleanSet(o.s); if(clean) localStorage.setItem('vdc-settings', JSON.stringify(clean));
    if(Array.isArray(o.l)) localStorage.setItem('vdc-likes', JSON.stringify(o.l.filter(x=>x&&typeof x.name==='string').slice(0,500)));
    history.replaceState(null,'',location.pathname+location.search);
    setTimeout(()=>toast('Your setup is loaded on this phone.'),400);
  }catch(e){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(_){} }
}
async function boot(){
  importSetupLink();
  try{
    const res=await fetch('menu.json',{cache:'no-cache'}); DATA=await res.json();
  }catch(e){ document.getElementById('main').innerHTML=''; document.getElementById('main').append(el('p',{class:'empty'},'Menus could not load. Check your connection and reopen the page.')); return; }
  const dates=Object.keys(DATA.days); const t=todayStr();
  state.date = dates.includes(t) ? t : dates.find(d=>new Date(d)>=new Date(t)) || dates[dates.length-1];
  loadNope(); loadPicks(); loadLikes(); loadSettings(); loadProfile(); applyMe();
  try{ const h=localStorage.getItem('vdc-hall'); if(h && (HALLS.includes(h)||h==='plan'||h==='day')) state.hall=h; }catch(e){}
  const fresh=document.getElementById('fresh');
  fresh.textContent = dates.includes(t) ? `Menus through ${dayLabel(dates[dates.length-1]).dow} ${dayLabel(dates[dates.length-1]).d}` : 'Menus are out of date';
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{ state.hall=b.dataset.tab; state.menu=false; state.menuVegan=null; save(); render(); }));
  render();
  loadWx();
  initSync();
}
if(typeof document!=='undefined' && document.getElementById('main')) boot();
if(typeof navigator!=='undefined' && 'serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
